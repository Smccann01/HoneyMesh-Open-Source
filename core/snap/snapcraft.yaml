name: network-decode-core
title: HoneyMesh Core Kernel Pilot
base: core24
version: '2.3.6-rc8-community5+s1'
summary: Developer pilot for HoneyMesh Core host protection
description: |
  Developer-only Core Snap candidate. It needs host eBPF/XDP access and is
  not qualified for the Snap Store or production. Installation starts no
  service. Setup creates per-host credentials, then an operator may run it
  manually on a disposable Ubuntu host with an explicitly selected test
  interface. The default config selects no interface and no sharing. The
  running agent requires readable host kernel BTF at /sys/kernel/btf/vmlinux;
  the kernel-btf plug and other host-control interfaces require manual
  connection in the strict diagnostic. Store approval is not yet granted.
license: Apache-2.0 AND (BSD-2-Clause OR GPL-2.0-only)
icon: snap/gui/icon.png
source-code: https://github.com/Smccann01/HoneyMesh-Open-Source/tree/main/core
issues: https://github.com/Smccann01/HoneyMesh-Open-Source/issues/31
grade: devel
confinement: devmode
platforms:
  amd64:

plugs:
  kernel-btf:
    interface: system-files
    read: [/sys/kernel/btf/vmlinux]

apps:
  network-decode-core:
    command: bin/run-agent
    daemon: simple
    install-mode: disable
    plugs: [network, network-bind, network-control, mount-observe, system-trace, firewall-control, kernel-btf]
  init:
    command: bin/init-agent

parts:
  agent:
    plugin: nil
    source: .
    build-snaps: [go/1.26/stable]
    override-build: |
      export GOTOOLCHAIN=go1.26.10 CGO_ENABLED=0
      cd "$CRAFT_PART_SRC"
      go mod download
      install -d "$CRAFT_PART_INSTALL/bin"
      go build -trimpath -buildvcs=false -ldflags="-buildid= -X main.Version=v${SNAPCRAFT_PROJECT_VERSION}" -o "$CRAFT_PART_INSTALL/bin/honeymesh" ./
  runtime:
    plugin: nil
    source: .
    stage-packages: [openssl, ca-certificates, netcat-openbsd]
    override-build: |
      install -Dm0755 "$CRAFT_PART_SRC/snap/launcher/init-agent" "$CRAFT_PART_INSTALL/bin/init-agent"
      install -Dm0755 "$CRAFT_PART_SRC/snap/launcher/run-agent" "$CRAFT_PART_INSTALL/bin/run-agent"
      install -Dm0755 "$CRAFT_PART_SRC/packaging/init-local-certs.sh" "$CRAFT_PART_INSTALL/bin/init-local-certs.sh"
      install -Dm0644 "$CRAFT_PART_SRC/packaging/honeymesh.community.json" "$CRAFT_PART_INSTALL/config/honeymesh.json"
      install -Dm0644 "$CRAFT_PART_SRC/LICENSE" "$CRAFT_PART_INSTALL/licenses/PROJECT-LICENSE"
      cp -a "$CRAFT_PART_SRC/LICENSES/." "$CRAFT_PART_INSTALL/licenses/"
