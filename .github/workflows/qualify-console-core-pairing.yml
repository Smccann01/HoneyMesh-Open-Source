name: Qualify published Console with Core RC8

on:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  pairing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare disposable host
        run: |
          set -euo pipefail
          sudo install -m 0755 "$(command -v node)" /usr/bin/node
          sudo ln -sfn "$(command -v npm)" /usr/bin/npm
          /usr/bin/node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'
          /usr/bin/npm --version
          sudo apt-get update
          sudo apt-get install -y iproute2 ripgrep
          printf '%s\n' "$GITHUB_RUN_ID" | sudo tee /run/honeymesh-qualification-disposable >/dev/null
      - name: Download and verify exact published bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pairing/core" "$RUNNER_TEMP/pairing/console"
          cd "$RUNNER_TEMP/pairing/core"
          gh release download v2.3.6-rc8-community5-pilot.1 -R "$GITHUB_REPOSITORY" -p honeymesh_2.3.6-rc8-community5_amd64.deb -p SHA256SUMS
          sha256sum -c SHA256SUMS
          gh attestation verify honeymesh_2.3.6-rc8-community5_amd64.deb -R "$GITHUB_REPOSITORY"
          cd "$RUNNER_TEMP/pairing/console"
          gh release download firewall-console-v0.2.1-beta.9-pilot.2 -R "$GITHUB_REPOSITORY" -p network-decode-firewall-console-0.2.1-beta.9-free-pilot.tar.gz -p SHA256SUMS
          sha256sum -c SHA256SUMS
          gh attestation verify network-decode-firewall-console-0.2.1-beta.9-free-pilot.tar.gz -R "$GITHUB_REPOSITORY"
      - name: Test account, opt-in, exact block, release, and cleanup
        run: |
          set -euo pipefail
          sudo env PATH=/usr/bin:/usr/sbin:/bin:/sbin python3 qa/console-pairing/qualify.py \
            --core-deb "$RUNNER_TEMP/pairing/core/honeymesh_2.3.6-rc8-community5_amd64.deb" \
            --console-bundle "$RUNNER_TEMP/pairing/console/network-decode-firewall-console-0.2.1-beta.9-free-pilot.tar.gz" \
            --report "$RUNNER_TEMP/pairing/report.json"
      - name: Preserve scoped report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-core-rc8-pairing
          path: ${{ runner.temp }}/pairing/report.json
          if-no-files-found: warn
          retention-days: 14
