name: Probe strict confinement for host agents

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/probe-host-agent-strict.yml'
      - '.github/scripts/host-agent-traffic-probe.py'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            snap_name: network-decode-core
          - component: node/agent
            snap_name: network-decode-node
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Convert candidate to strict for diagnostic build
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          sed -i 's/^confinement: devmode$/confinement: strict/' "$COMPONENT/snap/snapcraft.yaml"
          grep -q '^confinement: strict$' "$COMPONENT/snap/snapcraft.yaml"
      - name: Build strict diagnostic Snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: ${{ matrix.component }}
      - name: Probe BPF and XDP with strict confinement
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          SNAP_NAME: ${{ matrix.snap_name }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          for plug in network-control mount-observe system-trace firewall-control kernel-btf; do
            sudo snap connect "$SNAP_NAME:$plug" || true
          done
          sudo snap run "$SNAP_NAME.init"
          sudo ip link add hm-strict-test type veth peer name hm-strict-peer
          sudo ip netns add hm-snap-peer-ns
          sudo ip link set hm-strict-peer netns hm-snap-peer-ns
          sudo ip address add 198.18.0.1/30 dev hm-strict-test
          sudo ip link set hm-strict-test up
          sudo ip netns exec hm-snap-peer-ns ip link set lo up
          sudo ip netns exec hm-snap-peer-ns ip address add 198.18.0.2/30 dev hm-strict-peer
          sudo ip netns exec hm-snap-peer-ns ip link set hm-strict-peer up
          sudo ip netns exec hm-snap-peer-ns ping -c 1 -W 1 198.18.0.1
          sudo python3 - "$SNAP_NAME" <<'PY'
          import json, pathlib, sys
          config = pathlib.Path('/var/snap') / sys.argv[1] / 'common/honeymesh.json'
          data = json.loads(config.read_text())
          assert data['interfaces'] == []
          data['interfaces'] = ['hm-strict-test']
          config.write_text(json.dumps(data) + '\n')
          PY
          sudo timeout --signal=TERM --kill-after=5s 45s snap run "$SNAP_NAME" > strict-probe.log 2>&1 &
          probe_pid=$!
          attached=0
          for attempt in $(seq 1 12); do
            if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
              attached=1
              break
            fi
            if ! kill -0 "$probe_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$attached" -eq 1 ]; then
            echo 'STRICT_PROBE=attached'
            sudo python3 .github/scripts/host-agent-traffic-probe.py "$SNAP_NAME" || {
              wait "$probe_pid" || true
              exit 1
            }
          else
            echo 'STRICT_PROBE=blocked'
            grep -E 'Failed to load eBPF|Attach failed|attach XDP|operation not permitted|permission denied' strict-probe.log || true
            sudo journalctl -k --no-pager -n 150 | grep "snap.$SNAP_NAME" | grep 'DENIED' | tail -20 || true
            wait "$probe_pid" || true
            exit 1
          fi
          wait "$probe_pid" || true
          if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
            echo 'STRICT_PROBE=detach_failed'
            exit 1
          fi
          echo 'STRICT_PROBE=detached'
      - name: Probe crash, restart and private state
        env:
          SNAP_NAME: ${{ matrix.snap_name }}
        run: |
          set -eu
          sudo python3 .github/scripts/host-agent-lifecycle-probe.py before "$SNAP_NAME"
          sudo snap run "$SNAP_NAME" > crash-probe.log 2>&1 &
          probe_pid=$!
          attached=0
          for attempt in $(seq 1 15); do
            if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
              attached=1
              break
            fi
            if ! kill -0 "$probe_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$attached" -ne 1 ]; then
            cat crash-probe.log
            wait "$probe_pid" || true
            exit 1
          fi
          sudo pkill -KILL -x honeymesh
          wait "$probe_pid" || true
          for attempt in $(seq 1 10); do
            if ! sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
              break
            fi
            sleep 1
          done
          if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
            echo 'CRASH_PROBE=xdp_remained_attached' >&2
            exit 1
          fi
          echo 'CRASH_PROBE=xdp_detached'
          sudo timeout --signal=TERM --kill-after=5s 30s snap run "$SNAP_NAME" > restart-probe.log 2>&1 &
          probe_pid=$!
          attached=0
          for attempt in $(seq 1 15); do
            if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
              attached=1
              break
            fi
            if ! kill -0 "$probe_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$attached" -ne 1 ]; then
            cat restart-probe.log
            wait "$probe_pid" || true
            exit 1
          fi
          sudo python3 .github/scripts/host-agent-lifecycle-probe.py after "$SNAP_NAME"
          wait "$probe_pid" || true
          if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
            echo 'RESTART_PROBE=xdp_remained_attached' >&2
            exit 1
          fi
          echo 'RESTART_PROBE=state_preserved_and_detached'
      - name: Probe local refresh and revert state
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          SNAP_NAME: ${{ matrix.snap_name }}
        run: |
          set -eu
          snap_root="$RUNNER_TEMP/$SNAP_NAME-refresh-root"
          mkdir -p "$snap_root"
          unsquashfs -quiet -dest "$snap_root" "$SNAP_FILE"
          python3 - "$snap_root/meta/snap.yaml" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          changed, count = re.subn(r'(?m)^version: ([^\n]+)$', r'version: \1-ci1', source, count=1)
          assert count == 1, 'could not locate Snap version'
          path.write_text(changed)
          PY
          snap pack "$snap_root" "$RUNNER_TEMP" --filename "$SNAP_NAME-refresh.snap"
          sudo snap install --dangerous "$RUNNER_TEMP/$SNAP_NAME-refresh.snap"
          snap list "$SNAP_NAME" | grep -q -- '-ci1'
          sudo python3 .github/scripts/host-agent-lifecycle-probe.py state "$SNAP_NAME"
          sudo snap revert "$SNAP_NAME"
          if snap list "$SNAP_NAME" | grep -q -- '-ci1'; then
            echo 'REVERT_PROBE=wrong_revision' >&2
            exit 1
          fi
          sudo python3 .github/scripts/host-agent-lifecycle-probe.py state "$SNAP_NAME"
          echo 'REFRESH_REVERT_PROBE=private_state_preserved'
      - name: Probe explicitly enabled service and stop recovery
        env:
          SNAP_NAME: ${{ matrix.snap_name }}
        run: |
          set -eu
          services=$(sudo snap services "$SNAP_NAME")
          echo "$services"
          echo "$services" | grep -q 'disabled.*inactive'
          sudo snap start --enable "$SNAP_NAME"
          attached=0
          for attempt in $(seq 1 15); do
            if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
              attached=1
              break
            fi
            sleep 1
          done
          if [ "$attached" -ne 1 ]; then
            sudo snap logs "$SNAP_NAME" -n 50 || true
            exit 1
          fi
          sudo python3 .github/scripts/host-agent-lifecycle-probe.py after "$SNAP_NAME"
          before_id=$(sudo ip -details link show hm-strict-test | awk '/prog\/xdp id/ {for (i=1;i<=NF;i++) if ($i=="id") {print $(i+1); exit}}')
          test -n "$before_id"
          set +e
          sudo timeout --signal=TERM --kill-after=2s 8s snap run "$SNAP_NAME" > duplicate-probe.log 2>&1
          duplicate_status=$?
          set -e
          if [ "$duplicate_status" -eq 0 ] || [ "$duplicate_status" -ge 124 ]; then
            echo "CONFLICT_PROBE=second_agent_did_not_refuse status=$duplicate_status" >&2
            cat duplicate-probe.log
            exit 1
          fi
          after_id=$(sudo ip -details link show hm-strict-test | awk '/prog\/xdp id/ {for (i=1;i<=NF;i++) if ($i=="id") {print $(i+1); exit}}')
          if [ "$before_id" != "$after_id" ]; then
            echo 'CONFLICT_PROBE=xdp_program_replaced' >&2
            exit 1
          fi
          sudo python3 .github/scripts/host-agent-lifecycle-probe.py after "$SNAP_NAME"
          echo 'CONFLICT_PROBE=second_agent_refused_without_replacement'
          sudo snap stop --disable "$SNAP_NAME"
          services=$(sudo snap services "$SNAP_NAME")
          echo "$services"
          echo "$services" | grep -q 'disabled.*inactive'
          if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
            echo 'SERVICE_PROBE=xdp_remained_attached_after_stop' >&2
            exit 1
          fi
          echo 'SERVICE_PROBE=explicit_start_and_detach_on_stop'
      - name: Diagnose whether kernel BTF permission is required
        env:
          SNAP_NAME: ${{ matrix.snap_name }}
        run: |
          set -eu
          sudo snap disconnect "$SNAP_NAME:kernel-btf"
          sudo timeout --signal=TERM --kill-after=5s 18s snap run "$SNAP_NAME" > no-btf-probe.log 2>&1 &
          probe_pid=$!
          attached=0
          for attempt in $(seq 1 12); do
            if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
              attached=1
              break
            fi
            if ! kill -0 "$probe_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          wait "$probe_pid" || true
          sudo snap connect "$SNAP_NAME:kernel-btf"
          if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
            echo 'BTF_PROBE=xdp_remained_attached_after_exit' >&2
            exit 1
          fi
          if [ "$attached" -eq 1 ]; then
            echo 'BTF_PROBE=attached_without_kernel_btf_plug' >&2
            exit 1
          fi
          if ! grep -Fq 'Kernel BTF is required but /sys/kernel/btf/vmlinux is unreadable' no-btf-probe.log; then
            echo 'BTF_PROBE=missing_preflight_message' >&2
            cat no-btf-probe.log >&2
            exit 1
          fi
          echo 'BTF_PROBE=preflight_refused_missing_kernel_btf_access'
      - name: Probe snapshot restore after normal removal
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          SNAP_NAME: ${{ matrix.snap_name }}
        run: |
          set -eu
          snapshot_id=$(sudo snap save "$SNAP_NAME" | awk 'NR==2 {print $1}')
          case "$snapshot_id" in
            ''|*[!0-9]*) echo 'SNAPSHOT_PROBE=no_snapshot_id' >&2; exit 1 ;;
          esac
          sudo snap remove "$SNAP_NAME"
          if [ -e "/var/snap/$SNAP_NAME/common" ]; then
            echo 'SNAPSHOT_PROBE=state_remained_after_remove' >&2
            exit 1
          fi
          sudo snap install --dangerous "$SNAP_FILE"
          sudo snap restore "$snapshot_id" "$SNAP_NAME"
          sudo python3 .github/scripts/host-agent-lifecycle-probe.py state "$SNAP_NAME"
          services=$(sudo snap services "$SNAP_NAME")
          echo "$services"
          echo "$services" | grep -q 'disabled.*inactive'
          if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
            echo 'SNAPSHOT_PROBE=xdp_attached_after_restore' >&2
            exit 1
          fi
          echo 'SNAPSHOT_PROBE=private_state_restored_without_auto_start'
      - name: Purge Snap and verify cleanup
        env:
          SNAP_NAME: ${{ matrix.snap_name }}
        run: |
          sudo snap remove --purge "$SNAP_NAME"
          if [ -e "/var/snap/$SNAP_NAME/common" ]; then
            echo 'PURGE_PROBE=private_state_remained' >&2
            exit 1
          fi
          if sudo ip -details link show hm-strict-test | grep -q 'prog/xdp'; then
            echo 'PURGE_PROBE=xdp_remained_attached' >&2
            exit 1
          fi
          echo 'PURGE_PROBE=state_removed_and_xdp_detached'
      - name: Remove diagnostic Snap and interface
        if: always()
        env:
          SNAP_NAME: ${{ matrix.snap_name }}
        run: |
          sudo snap remove --purge "$SNAP_NAME" || true
          sudo ip link del hm-strict-test 2>/dev/null || true
          sudo ip netns del hm-snap-peer-ns 2>/dev/null || true
