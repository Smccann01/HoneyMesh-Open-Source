name: Build observation-only Console Snap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'snap/**'
      - 'firewall-console/**'
      - '.github/workflows/build-console-snap.yml'

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test Console source
        run: |
          cd firewall-console
          npm ci
          npm test
      - name: Build strict Snap candidate
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
      - name: Install and smoke-test candidate
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          snap services network-decode-console
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/hm-snap-health.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          with open('/tmp/hm-snap-health.json', encoding='utf-8') as handle:
              health = json.load(handle)
          assert health['status'] == 'ok'
          assert health['scope'] == 'local_application_firewall_lab'
          PY
          sudo snap connect network-decode-console:network-observe
          token=$(sudo python3 -c 'import json; print(json.load(open("/var/snap/network-decode-console/common/private/credentials.json"))["adminToken"])')
          curl --fail --silent --show-error -H "Authorization: Bearer $token" \
            http://127.0.0.1:8787/api/status > /tmp/hm-snap-status.json
          curl --fail --silent --show-error -H "Authorization: Bearer $token" \
            http://127.0.0.1:8787/api/kernel/telemetry > /tmp/hm-snap-telemetry.json
          unset token
          python3 - <<'PY'
          import json
          with open('/tmp/hm-snap-status.json', encoding='utf-8') as handle:
              status = json.load(handle)
          with open('/tmp/hm-snap-telemetry.json', encoding='utf-8') as handle:
              telemetry = json.load(handle)
          assert status['policy']['mode'] == 'OBSERVE', status
          assert telemetry['scope'] == 'current_process_network_namespace', telemetry
          assert telemetry['source'] == 'Linux /proc/net socket and interface counters', telemetry
          PY
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/host/grants)" != 200
          sudo snap stop network-decode-console
          sudo snap remove --purge network-decode-console
      - name: Record checksum
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: sha256sum "$SNAP_FILE" > SNAP-SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-decode-console-snap-candidate
          path: |
            ${{ steps.build.outputs.snap }}
            SNAP-SHA256SUMS
          retention-days: 7
